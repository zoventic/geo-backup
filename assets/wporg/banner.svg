<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1544 500" width="1544" height="500">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="60%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#022c22"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <filter id="blurGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1544" height="500" fill="url(#bg)"/>
  
  <!-- Subtle grid and radar rings on the right side -->
  <g transform="translate(1150, 250)" opacity="0.45">
    <circle r="220" fill="none" stroke="#10b981" stroke-width="1.5" stroke-dasharray="6 6"/>
    <circle r="160" fill="none" stroke="#10b981" stroke-width="2" opacity="0.6"/>
    <circle r="100" fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.8"/>
    <circle r="40" fill="none" stroke="#34d399" stroke-width="2"/>
    <line x1="-240" y1="0" x2="240" y2="0" stroke="#10b981" stroke-width="1" stroke-dasharray="4 4"/>
    <line x1="0" y1="-240" x2="0" y2="240" stroke="#10b981" stroke-width="1" stroke-dasharray="4 4"/>
    <!-- Floating Blips -->
    <circle cx="80" cy="-60" r="7" fill="#34d399" filter="url(#blurGlow)"/>
    <circle cx="-90" cy="70" r="6" fill="#38bdf8" filter="url(#blurGlow)"/>
    <circle cx="120" cy="80" r="5" fill="#10b981"/>
  </g>

  <!-- Left Content Branding -->
  <g transform="translate(100, 110)">
    <!-- Pill Tag -->
    <rect width="320" height="34" rx="17" fill="rgba(16,185,129,0.12)" stroke="#10b981" stroke-width="1.5"/>
    <text x="18" y="22" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" letter-spacing="1">
      AI SEARCH &amp; GENERATIVE ENGINE OPTIMIZATION
    </text>

    <!-- Main Title -->
    <text x="0" y="110" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="68" font-weight="900" letter-spacing="-1">
      Zoventic <tspan fill="url(#accent)">GEO</tspan>
    </text>

    <!-- Subtitle -->
    <text x="0" y="160" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="600">
      AI Search Optimization &amp; llms.txt Suite for WooCommerce
    </text>

    <!-- Value Bullet Points / Feature Badges -->
    <g transform="translate(0, 205)">
      <!-- Badge 1: llms.txt -->
      <g transform="translate(0, 0)">
        <rect width="180" height="42" rx="8" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
        <text x="16" y="26" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600">
          ⚡ Dynamic /llms.txt
        </text>
      </g>

      <!-- Badge 2: Prompt Guard -->
      <g transform="translate(196, 0)">
        <rect width="210" height="42" rx="8" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
        <text x="16" y="26" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600">
          🛡️ Prompt Guard™ Shield
        </text>
      </g>

      <!-- Badge 3: Order Attribution -->
      <g transform="translate(422, 0)">
        <rect width="240" height="42" rx="8" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
        <text x="16" y="26" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600">
          💰 AI Order Attribution
        </text>
      </g>

      <!-- Badge 4: ChatGPT & Perplexity -->
      <g transform="translate(678, 0)">
        <rect width="260" height="42" rx="8" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
        <text x="16" y="26" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600">
          🤖 ChatGPT · Perplexity · Claude
        </text>
      </g>
    </g>

    <!-- Small Footer Note -->
    <text x="0" y="295" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14">
      Built for WooCommerce 7.0+ &amp; 9.x | Zero Checkout Latency | High-Performance Entity Graph
    </text>
  </g>
</svg>
