<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#022c22"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background rounded rectangle -->
  <rect width="256" height="256" rx="56" fill="url(#bgGrad)"/>
  <rect width="252" height="252" x="2" y="2" rx="54" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="2"/>

  <!-- Radar circle grid lines -->
  <circle cx="128" cy="128" r="85" fill="none" stroke="rgba(16,185,129,0.15)" stroke-width="2"/>
  <circle cx="128" cy="128" r="55" fill="none" stroke="rgba(16,185,129,0.25)" stroke-width="2"/>
  <circle cx="128" cy="128" r="25" fill="none" stroke="rgba(16,185,129,0.4)" stroke-width="2"/>
  
  <!-- Crosshairs -->
  <line x1="128" y1="35" x2="128" y2="221" stroke="rgba(16,185,129,0.2)" stroke-width="1.5" stroke-dasharray="4 4"/>
  <line x1="35" y1="128" x2="221" y2="128" stroke="rgba(16,185,129,0.2)" stroke-width="1.5" stroke-dasharray="4 4"/>

  <!-- Central Dynamic Compass / AI Discovery Icon -->
  <g filter="url(#glow)">
    <!-- Stylized 'Z' overlapping with Search compass node -->
    <path d="M96 86 L160 86 L108 152 L160 152" fill="none" stroke="url(#glowGrad)" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Orbital Nodes (AI Crawlers) -->
    <circle cx="160" cy="86" r="6" fill="#34d399"/>
    <circle cx="108" cy="152" r="6" fill="#38bdf8"/>
    <circle cx="180" cy="128" r="5" fill="#10b981"/>
    <circle cx="85" cy="110" r="4" fill="#06b6d4"/>
  </g>

  <!-- Prompt Guard Shield Indicator Badge -->
  <g transform="translate(164, 164)">
    <circle cx="18" cy="18" r="22" fill="#0f172a" stroke="#10b981" stroke-width="2"/>
    <path d="M18 8 L28 12 C28 20 23 26 18 29 C13 26 8 20 8 12 Z" fill="url(#glowGrad)"/>
    <path d="M15 18 L17 20 L22 15" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
